[package]
name = "echoguard-audio"
description = "Audio device I/O for desk-echo-guard: WASAPI (Windows) and a simulated backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
parking_lot.workspace = true
rtrb = "0.3"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
# endpoint volume / mute for the deaf-loopback check (same version as wasapi)
windows = { version = "0.62", features = ["Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
# MMCSS ("Pro Audio") for the audio threads, power-throttling opt-out
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
