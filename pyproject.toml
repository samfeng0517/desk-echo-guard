[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-echo-guard"
version = "0.1.0"
description = "System-wide AEC (speaker loopback -> VB-Cable virtual mic) and a Hey Siri anti-trigger filter for Discord/LINE calls on Windows"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundcard>=0.4.3",
  "livekit>=1.0",
  "pyaec>=1.0.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
siri = ["openwakeword>=0.6.0", "onnxruntime>=1.16"]
dev = ["pytest>=7", "pystoi>=0.4"]

[project.scripts]
echoguard = "echoguard.cli:main"

[project.gui-scripts]
echoguard-gui = "echoguard.gui:main"

[tool.setuptools]
packages = ["echoguard"]

[tool.setuptools.package-data]
echoguard = ["assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
