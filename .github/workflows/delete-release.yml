name: Delete release

# Manual maintenance: remove a GitHub Release and its tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to delete (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
