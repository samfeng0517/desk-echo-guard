name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.4.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write   # create releases on tags

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - run: cargo build --release -p desk-echo-guard
      - name: Self-test the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\DeskEchoGuard.exe dist\DeskEchoGuard.exe
          $p = Start-Process -FilePath dist\DeskEchoGuard.exe -ArgumentList '--self-test','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: DeskEchoGuard-windows
          path: |
            dist/DeskEchoGuard.exe
            selftest.txt
      - name: Release (tag push, or manual run with release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/DeskEchoGuard.exe
          generate_release_notes: true
          body: |
            第一次使用請看[5 分鐘上手](https://github.com/samfeng0517/desk-echo-guard/blob/main/docs/getting-started.md)；遇到問題看[常見問題](https://github.com/samfeng0517/desk-echo-guard/blob/main/docs/faq.md)。
            下載 `DeskEchoGuard.exe` 即可使用（單一檔案，不用安裝），另外需要安裝 [VB-Cable](https://vb-audio.com/Cable/)。

            > 從 v0.4.0 起是 Rust 改寫版，通過所有自動測試與 Windows 自我檢測，但實機使用時間還不長。
            > 遇到問題可以先改用 [v0.3.1](https://github.com/samfeng0517/desk-echo-guard/releases/tag/v0.3.1)（設定檔共用），也歡迎開 issue 回報。
