[workspace]
resolver = "2"
members = ["crates/dsp", "crates/aec", "crates/audio", "crates/core", "crates/app"]

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
echoguard-dsp = { path = "crates/dsp" }
echoguard-aec = { path = "crates/aec" }
echoguard-audio = { path = "crates/audio" }
echoguard-core = { path = "crates/core" }
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
realfft = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
hound = "3"
rand = "0.8"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# DSP is unusably slow unoptimised; keep tests fast
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
debug = "line-tables-only"   # full debuginfo makes each test binary ~440 MB
[profile.test]
opt-level = 2
debug = "line-tables-only"
