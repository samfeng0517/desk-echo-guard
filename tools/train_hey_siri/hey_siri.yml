# openWakeWord training config for a "hey siri" detector.
# Based on openWakeWord's examples/custom_model.yml (v0.6.x) - compare with the
# upstream file if train.py complains about a key, the schema can change.
# Paths are relative to the directory you run train.py from (see README.md).

model_name: "hey_siri"

# iOS 17+ also accepts plain "Siri"; include both so either gets notched.
target_phrase:
  - "hey siri"
  - "siri"

# Confusable phrases used as hard negatives (reduces false triggers on
# similar-sounding words, which would otherwise get notched needlessly).
custom_negative_phrases:
  - "hey series"
  - "hey sarah"
  - "hey cerie"
  - "hey city"
  - "hey siri-ous"
  - "seriously"
  - "hey sorry"
  - "hey there"
  - "very easy"

n_samples: 20000
n_samples_val: 2000
tts_batch_size: 50
augmentation_batch_size: 16
augmentation_rounds: 1

piper_sample_generator_path: "./piper-sample-generator"
output_dir: "./hey_siri_model"

rir_paths:
  - "./mit_rirs"
background_paths:
  - "./audioset_16k"
  - "./fma"
background_paths_duplication_rate:
  - 1
  - 1

false_positive_validation_data_path: "./validation_set_features.npy"

feature_data_files:
  "ACAV100M_sample": "./openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32
steps: 50000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
