[package]
name = "echoguard-wakeword"
description = "openWakeWord (Hey Siri model) detector (pure-Rust tract ONNX inference) for the Siri guard"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
echoguard-dsp.workspace = true
tract-onnx = { version = "0.23.9", default-features = false }
log.workspace = true

# Model download.  Windows: SChannel (system certificate store, no C build
# needed, so the crate also checks from Linux); elsewhere: rustls + the
# platform verifier.
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
